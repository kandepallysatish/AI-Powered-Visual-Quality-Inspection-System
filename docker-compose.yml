services:
  backend:
    build: ./backend
    container_name: quality-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: quality-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped